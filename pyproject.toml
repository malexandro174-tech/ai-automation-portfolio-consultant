[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-automation-portfolio-consultant"
version = "1.0.0"
description = "Source-backed portfolio RAG and solution matching"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.136,<1", "psycopg[binary]>=3.3,<4", "pydantic>=2.11,<3"]

[project.optional-dependencies]
test = ["pytest>=8.4,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portfolio_rag = ["model_pin.json", "prompts/*.txt", "knowledge_public/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
